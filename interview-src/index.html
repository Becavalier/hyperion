    <script>
      (function(){try{var s=JSON.parse(localStorage.getItem('prep.settings')||'{}');var t=s.theme||'system';if(t==='light')document.documentElement.setAttribute('data-theme','light');else if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
    </script>

    <script type="module" src="/src/main.tsx"></script>
